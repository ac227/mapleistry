site_name: Mapleistry
site_url: https://mapleistry.vercel.app
site_author: Abner Surrey
site_description: 更适合高中生体质的化学拓展资料
repo_name: ac227/mapleistry
repo_url: https://github.com/ac227/mapleistry
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025-2026 mapleistry

theme:
  name: material
  language: zh
  logo: assets/logo.png
  favicon: assets/favicon.ico
  
  palette:
    primary: custom
    accent: custom
  font:
    text: Roboto, system-ui, sans-serif
    code: JetBrains Mono, Consolas, monospace

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit
    - content.action.view

extra:
  generator: false

markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: zh
      separator: '[\s\u200b\-，。：；！？、（）「」『』【】《》]++'
  - git-revision-date

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML

extra_css:
  - extra.css

nav:
  - 前言: index.md
  - 原子与元素: main/atom-and-elements.md
  - 分子结构: main/molecular-structure.md
  - 晶体结构: main/crystal-structure.md
  - 配合物: main/complexes.md
  - 热力学: main/thermodynamics.md
  - 动力学: main/kinetics.md
  - 水溶液: main/aqueous-solutions.md
  - 电化学: main/electrochemistry.md
  - 有机化学:
      - 基础知识: main/organic/basic-concepts.md
      - 有机物命名: main/organic/organic-compounds-nomenclature.md
      - 反应机理: main/organic/reaction-mechanisms.md
      - 重要反应: main/organic/important-reactions.md
  - 后记: about.md

site_dir: site
dev_addr: 0.0.0.0:8000